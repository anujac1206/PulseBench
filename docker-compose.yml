services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsebench
      POSTGRES_USER: pulsebench
      POSTGRES_PASSWORD: pulsebench
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://pulsebench:pulsebench@postgres:5432/pulsebench
      JWT_SECRET: change-me-to-a-long-random-string
      PORT: 4000
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
