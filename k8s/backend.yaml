apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pulsebench
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: <YOUR_DOCKERHUB_USERNAME>/pulsebench-backend:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - secretRef: { name: pulsebench-secret }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pulsebench
spec:
  type: NodePort
  selector: { app: backend }
  ports:
    - port: 4000
      targetPort: 4000
