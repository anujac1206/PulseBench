apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pulsebench
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: <YOUR_DOCKERHUB_USERNAME>/pulsebench-frontend:latest
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: pulsebench
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
